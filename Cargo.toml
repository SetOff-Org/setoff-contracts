[workspace]
resolver = "3"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/SetOff-Org/setoff-contracts"
homepage = "https://github.com/SetOff-Org"
authors = ["SetOff"]

[workspace.dependencies]
soroban-sdk = "28"

# Soroban contracts: small, with checked arithmetic even in release.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
