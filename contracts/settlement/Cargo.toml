[package]
name = "setoff-settlement"
description = "Soroban contract for netted settlement with guaranteed finality: obligations accrue, only net positions move."
keywords = ["soroban", "stellar", "netting", "settlement", "clearing"]
categories = ["finance", "cryptography::cryptocurrencies"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

# The soroban macros emit `allow(unsafe_code)` and undocumented items, so this crate
# denies rather than forbids unsafe code and does not require docs on generated code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
