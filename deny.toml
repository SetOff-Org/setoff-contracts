# cargo-deny: licenses, security advisories and dependency sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained (not vulnerable). It is a proc-macro reached only
  # through soroban-env-host, the native test host; the deployed WASM does not
  # contain it.
  { id = "RUSTSEC-2024-0436", reason = "build-time macro of the test host, absent from the contract" },
  # `crypto-bigint` 0.5 has timing variability in constant-time operations,
  # fixed only in 0.7.6. It is reached only through soroban-env-host's
  # elliptic-curve 0.13, the native test host; `cargo tree -e normal --target
  # wasm32v1-none -i crypto-bigint` shows the deployed WASM does not contain
  # it, and soroban-sdk 29 still uses 0.5. Remove once soroban moves to 0.7.
  { id = "RUSTSEC-2026-0387", reason = "test host only (elliptic-curve 0.13), absent from the contract; no 0.5.x fix exists" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
