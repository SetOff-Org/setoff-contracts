# cargo-deny: licenses, security advisories and dependency sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained (not vulnerable). It is a proc-macro reached only
  # through soroban-env-host, the native test host; the deployed WASM does not
  # contain it.
  { id = "RUSTSEC-2024-0436", reason = "build-time macro of the test host, absent from the contract" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
